services:
  # ────────────────────────────────────────────
  # Database — PostgreSQL
  # ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: stocksense-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stocksense
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stocksense"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - stocksense-net

  # ────────────────────────────────────────────
  # Backend — Express + Prisma
  # ────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stocksense-backend
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
      - path: ./.env
        required: false
    environment:
      NODE_ENV: production
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - stocksense-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ────────────────────────────────────────────
  # Frontend — Vite build served by Nginx
  # ────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: stocksense-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - stocksense-net

networks:
  stocksense-net:
    driver: bridge

volumes:
  postgres_data:
